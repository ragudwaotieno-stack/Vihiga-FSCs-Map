<title>Vihiga FSC and Agrovet Map</title>
<style>
/* Layout: a framed map sheet (title and logo, north arrow, scale, credits inside the frame) with filters above and live counts beside it. Colour: navy accent; tier colours carry meaning only. */
:root{--bg:#f4f7fb;--surface:#ffffff;--fg:#14233a;--muted:#55657b;--line:#cfd9e6;--accent:#1f5fa8;--map:#f1f5fa;--grid:#dde5ef;--wline:#9fb0c4;--sline:#5f7794;--cline:#1f3a5f;
--t1:#2a8a57;--t2:#d99a12;--t3:#c4452f;--s1:#0072b2;--s2:#e69f00;--s3:#009e73;--s4:#cc79a7;--s5:#d55e00;--s6:#56b4e9;--dot-edge:#ffffff;--halo:#f1f5fa;--ag:#7a2e8e;--ag-edge:#ffffff;
--font:"Maiandra GD","Segoe UI",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1724;--surface:#152233;--fg:#e6edf6;--muted:#9aabc1;--line:#2a3b52;--accent:#6fa8e8;--map:#101c2c;--grid:#1c2d44;--wline:#3f5675;--sline:#7d97b8;--cline:#bcd0ea;--t1:#4fc083;--t2:#f0b73a;--t3:#ee7a62;--dot-edge:#0e1724;--halo:#101c2c;color-scheme:dark}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ag:#d79be8;--ag-edge:#0e1724}}
:root[data-theme="dark"]{--ag:#d79be8;--ag-edge:#0e1724;--bg:#0e1724;--surface:#152233;--fg:#e6edf6;--muted:#9aabc1;--line:#2a3b52;--accent:#6fa8e8;--map:#101c2c;--grid:#1c2d44;--wline:#3f5675;--sline:#7d97b8;--cline:#bcd0ea;--t1:#4fc083;--t2:#f0b73a;--t3:#ee7a62;--dot-edge:#0e1724;--halo:#101c2c;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);padding-inline:16px;padding-block:18px}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:14px}
.controls{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-start}
.grp{display:grid;gap:6px;min-width:0}
.grp>span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button.chip{font:inherit;font-size:.82rem;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button.chip[aria-pressed="false"]{opacity:.45}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:.85rem;padding:6px 14px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:700}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dim{opacity:.4;pointer-events:none}
button.chip:focus-visible,.zoom button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}
select{font:inherit;font-size:.85rem;padding:5px 8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px}
label.chk{font-size:.85rem;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.main{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;align-items:start}
@media(max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mapbox{position:relative;background:var(--map);touch-action:none}
svg#map{display:block;width:100%;height:auto}
.title{position:absolute;top:10px;left:10px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px 8px 8px;max-width:calc(100% - 70px);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.title img{width:38px;height:38px;flex:none}
.title h1{font-size:.98rem;white-space:nowrap;line-height:1.2;margin:0;text-wrap:balance}
@media(max-width:560px){.title h1{white-space:normal;font-size:.85rem}}
.title p{margin:1px 0 0;font-size:.6rem;color:var(--muted);line-height:1.3}
.zoom{position:absolute;top:10px;right:10px;display:grid;gap:4px}
.zoom button{width:32px;height:32px;font:inherit;font-size:1.05rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;cursor:pointer}
.north{position:absolute;right:16px;top:118px;width:26px;color:var(--fg)}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:.8rem;line-height:1.35;box-shadow:0 4px 14px rgba(0,0,0,.18);max-width:220px;z-index:3}
.tip b{display:block;font-size:.88rem}
.scale{position:absolute;left:12px;bottom:10px;font-size:.72rem;color:var(--fg);display:grid;gap:3px;background:var(--surface);padding:4px 8px;border-radius:4px;opacity:.95}
.scale i{display:block;height:5px;border:1.5px solid var(--fg);border-top:none}
.credits{border-top:1px solid var(--line);padding:10px 14px;font-size:.7rem;line-height:1.5;color:var(--muted);display:grid;gap:4px}
.credits b{color:var(--fg)}
.credits a{color:var(--accent)}
.side{display:grid;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.big{font-size:1.9rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;padding:3px 0;font-variant-numeric:tabular-nums}
.kv span:first-child{color:var(--muted)}
.note{font-size:.78rem;color:var(--muted);line-height:1.5}
text{font-family:var(--font)}
</style>
<div class="wrap">
 <div class="controls">
  <div class="grp"><span>Show</span><div class="seg" id="showSeg" role="group" aria-label="Layer to show"><button data-v="fsc" aria-pressed="false">● FSCs</button><button data-v="agv" aria-pressed="false">◆ Agrovets</button><button data-v="both" aria-pressed="true">Both</button></div></div>
  <div class="grp" id="tierGrp"><span>FSC tier</span><div class="chips" id="tierChips"></div></div>
  <div class="grp"><span>Sub-county</span><div class="chips" id="subChips"></div></div>
  <div class="grp" id="colGrp"><span>FSC colour by</span><select id="colorBy" aria-label="Colour by"><option value="tier">Tier</option><option value="sub">Sub-county</option></select></div>
  <div class="grp" id="licGrp"><span>Agrovet licences</span><select id="licSel" aria-label="Agrovet licences"><option value="all">All agrovets</option><option value="full">Hold all four licences</option><option value="gap">Missing at least one</option></select></div>
  <div class="grp"><span>Display</span><div style="display:flex;gap:14px;flex-wrap:wrap"><label class="chk"><input type="checkbox" id="sizeBy" checked> Size by farmers served / reached</label><label class="chk"><input type="checkbox" id="wardLab" checked> Ward names</label></div></div>

 for(let l=-0.05;l<=lat1;l+=0.05){const y=Y(l);s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="${1/z}"/><text x="${4/z}" y="${y-3/z}" font-size="${11/z}" fill="var(--muted)">${l.toFixed(2).replace("-0.00","0.00")}°${l<-0.001?"S":"N"}</text>`}
 Object.entries(WP).forEach(([w,p])=>{const k=WARDSUB[w];s+=`<path d="${p}" fill="${SUBC[k]}" fill-opacity="${st.subs.has(k)?.14:.03}" stroke="var(--wline)" stroke-width="${.8/z}" stroke-linejoin="round"/>`});
 Object.values(SP).forEach(p=>{s+=`<path d="${p}" fill="none" stroke="var(--sline)" stroke-width="${1.7/z}" stroke-linejoin="round"/>`});
 s+=`<path d="${CP}" fill="none" stroke="var(--cline)" stroke-width="${2.8/z}" stroke-linejoin="round"/>`;
 Object.entries(B.sc).forEach(([k,c])=>{s+=`<text x="${X(c[0])}" y="${Y(c[1])}" text-anchor="middle" font-size="${17/z}" letter-spacing="${3/z}" font-weight="700" fill="var(--sline)" fill-opacity=".55" style="text-transform:uppercase">${k.toUpperCase()}</text>`});
 if(st.lab){Object.entries(B.wc).forEach(([k,c])=>{s+=`<text x="${X(c[0])}" y="${Y(c[1])+16/z}" text-anchor="middle" font-size="${10/z}" fill="var(--muted)" stroke="var(--halo)" stroke-width="${3/z}" paint-order="stroke">${k}</text>`})}
 let shown=0,farm=0,ash=0,ap=0,afull=0;const tc={1:0,2:0,3:0};
 const showF=st.show!=="agv",showA=st.show!=="fsc";
 if(showF){const order=DATA.map((r,i)=>i).sort((a,b)=>DATA[b][6]-DATA[a][6]);
 order.forEach(i=>{const r=DATA[i];if(!st.tiers.has(r[4])||!st.subs.has(r[2]))return;shown++;farm+=r[6];tc[r[4]]++;
  const c=st.by==="tier"?TIERC[r[4]]:SUBC[r[2]];
  s+=`<circle data-i="${i}" cx="${X(r[1])}" cy="${Y(r[0])}" r="${rad(r,z)}" fill="${c}" fill-opacity=".88" stroke="var(--dot-edge)" stroke-width="${1.2/z}"/>`})}
 if(showA){AG.forEach((a,i)=>{if(!st.subs.has(a[2])||!licOk(a))return;ash++;if(a[5]==="yes")ap++;if(a.slice(5,9).every(x=>x==="yes"))afull++;
  const d=(st.size?6+FB[a[9]][0]*1.3:9)/z;
  s+=`<path data-a="${i}" d="${agPath(X(a[1]),Y(a[0]),d)}" fill="var(--ag)" stroke="var(--ag-edge)" stroke-width="${1.6/z}" stroke-linejoin="miter"/>`})}
 svg.innerHTML=s;
 document.getElementById("cnt").textContent=(showF?shown:0)+(showA?ash:0);
 document.getElementById("cntLab").textContent=showF&&showA?`points shown: ${shown} FSCs, ${ash} agrovets`:showF?`of ${DATA.length} FSCs shown`:`of ${AG.length} agrovets shown`;
 document.getElementById("ttl").textContent=st.show==="fsc"?"Farmers' Service Centers in Vihiga County":st.show==="agv"?"Agrovets in Vihiga County":"Farmers' Service Centers and Agrovets in Vihiga County";
 document.getElementById("stats").innerHTML=(showF?`<div class="kv"><span>FSCs shown</span><b>${shown}</b></div><div class="kv"><span>Farmers served</span><b>${fmt(farm)}</b></div><div class="kv"><span>Tier 1 / 2 / 3</span><b>${tc[1]} / ${tc[2]} / ${tc[3]}</b></div>`:"")+(showA?`<div class="kv" style="${showF?"margin-top:6px;border-top:1px solid var(--line);padding-top:8px":""}"><span>Agrovets shown</span><b>${ash}</b></div><div class="kv"><span>With county permit</span><b>${ap}</b></div><div class="kv"><span>Hold all 4 licences</span><b>${afull}</b></div>`:"");
 document.getElementById("tierGrp").classList.toggle("dim",!showF);document.getElementById("colGrp").classList.toggle("dim",!showF);document.getElementById("licGrp").classList.toggle("dim",!showA);
 const km=view.w/W*(lon1-lon0)*111.2;const nice=[1,2,5,10,20,50].find(v=>v>=km*0.18)||50;
 document.getElementById("scaleLab").textContent=nice+" km";document.getElementById("scaleBar").style.width=(nice/km)*box.clientWidth+"px";
}
function legend(){const el=document.getElementById("legend");let h="";const sf=st.show!=="agv",sa=st.show!=="fsc";
 if(sf){h+='<div class="grp"><span>FSCs (circles) · '+(st.by==="tier"?"tier":"sub-county")+'</span></div>';
 const items=st.by==="tier"?[1,2,3].map(t=>[TIERC[t],TIERL[t]]):Object.keys(SUBL).map(k=>[SUBC[k],SUBL[k]]);
 items.forEach(([c,l])=>h+=`<div class="kv" style="justify-content:flex-start;gap:8px"><span class="sw" style="background:${c}"></span><span style="color:var(--fg)">${l}</span></div>`)}
 if(sa)h+=`<div class="grp" style="${sf?"margin-top:8px":""}"><span>Agrovets (diamonds)</span></div><div class="kv" style="justify-content:flex-start;gap:8px"><svg width="14" height="14" viewBox="-7 -7 14 14"><path d="M0 -6L6 0L0 6L-6 0Z" fill="var(--ag)" stroke="var(--ag-edge)" stroke-width="1"/></svg><span style="color:var(--fg)">Agrovet</span></div>`;
 h+='<div style="height:6px"></div>';
 h+=`<div class="kv" style="justify-content:flex-start;gap:8px;margin-top:4px"><span style="display:inline-block;width:20px;border-top:2.5px solid var(--cline)"></span><span style="color:var(--fg)">County boundary</span></div><div class="kv" style="justify-content:flex-start;gap:8px"><span style="display:inline-block;width:20px;border-top:1.7px solid var(--sline)"></span><span style="color:var(--fg)">Sub-county boundary</span></div><div class="kv" style="justify-content:flex-start;gap:8px"><span style="display:inline-block;width:20px;border-top:1px solid var(--wline)"></span><span style="color:var(--fg)">Ward boundary</span></div>`;
 if(st.size)h+=`<div class="note" style="margin-top:6px">Larger symbol = more farmers ${st.show==="agv"?"reached (by band)":st.show==="fsc"?"served (up to "+fmt(maxF)+")":"served (FSCs) or reached (agrovets)"}.</div>`;el.innerHTML=h}
function chips(){const t=document.getElementById("tierChips"),u=document.getElementById("subChips");
 t.innerHTML=[1,2,3].map(k=>`<button class="chip" data-t="${k}" aria-pressed="${st.tiers.has(k)}"><span class="sw" style="background:${TIERC[k]}"></span>Tier ${k}</button>`).join("");
 u.innerHTML=Object.keys(SUBL).map(k=>`<button class="chip" data-s="${k}" aria-pressed="${st.subs.has(k)}">${SUBL[k]}</button>`).join("")}
function toggle(set,v){if(set.has(v)){if(set.size>1)set.delete(v)}else set.add(v)}
document.getElementById("tierChips").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;toggle(st.tiers,+b.dataset.t);chips();draw()});
document.getElementById("subChips").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;toggle(st.subs,b.dataset.s);chips();draw()});
document.getElementById("showSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;st.show=b.dataset.v;document.querySelectorAll("#showSeg button").forEach(x=>x.setAttribute("aria-pressed",x===b));legend();draw()});
document.getElementById("licSel").addEventListener("change",e=>{st.lic=e.target.value;draw()});
document.getElementById("colorBy").addEventListener("change",e=>{st.by=e.target.value;legend();draw()});
document.getElementById("sizeBy").addEventListener("change",e=>{st.size=e.target.checked;legend();draw()});
document.getElementById("wardLab").addEventListener("change",e=>{st.lab=e.target.checked;draw()});
function zoom(f){const nw=Math.min(W,Math.max(W/12,view.w/f)),nh=nw*H/W,cx=view.x+view.w/2,cy=view.y+view.h/2;
 view.x=Math.min(W-nw,Math.max(0,cx-nw/2));view.y=Math.min(H-nh,Math.max(0,cy-nh/2));view.w=nw;view.h=nh;draw()}
document.getElementById("zin").onclick=()=>zoom(1.6);document.getElementById("zout").onclick=()=>zoom(1/1.6);
document.getElementById("zrs").onclick=()=>{view={x:0,y:0,w:W,h:H};draw()};
let drag=null;
svg.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false};svg.setPointerCapture(e.pointerId)});
svg.addEventListener("pointermove",e=>{
 if(drag){const k=view.w/svg.clientWidth,dx=(e.clientX-drag.x)*k,dy=(e.clientY-drag.y)*k;if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4)drag.moved=true;
  if(drag.moved){view.x=Math.min(W-view.w,Math.max(0,drag.vx-dx));view.y=Math.min(H-view.h,Math.max(0,drag.vy-dy));draw();tip.hidden=true;return}}
 const el=document.elementFromPoint(e.clientX,e.clientY);const c=el&&el.closest&&el.closest("[data-i],[data-a]");if(!c){tip.hidden=true;return}showTip(c,e)});
svg.addEventListener("pointerup",e=>{const was=drag&&drag.moved;drag=null;if(!was){const el=document.elementFromPoint(e.clientX,e.clientY);const c=el&&el.closest&&el.closest("[data-i],[data-a]");if(c)showTip(c,e)}});
svg.addEventListener("pointerleave",()=>{tip.hidden=true});
function showTip(c,e){const b=box.getBoundingClientRect();
 if(c.dataset.a!==undefined){const a=AG[+c.dataset.a],yn=v=>v==="yes"?"Yes":v==="no"?"No":"–";
  tip.innerHTML=`<b>Agrovet · ${WARD[a[3]]}</b>${SUBL[a[2]]} sub-county<br>${a[4]}<br>Farmers reached: ${FB[a[9]][1]}<br>${LICN.map((n,k)=>n+": "+yn(a[5+k])).join(" · ")}`}
 else{const r=DATA[+c.dataset.i];
 tip.innerHTML=`<b>${WARD[r[3]]}</b>${SUBL[r[2]]} sub-county<br>${TIERL[r[4]]} · score ${r[5]}<br>${fmt(r[6])} farmers served<br>${STAT[r[7]]||r[7]} · ${r[8]==="new"?"new, not on register":"on AGRA register"}`}
 tip.hidden=false;let x=e.clientX-b.left+14,y=e.clientY-b.top+14;if(x+230>b.width)x=e.clientX-b.left-230;if(y+120>b.height)y=e.clientY-b.top-110;tip.style.left=Math.max(4,x)+"px";tip.style.top=Math.max(4,y)+"px"}
window.addEventListener("resize",draw);
chips();legend();draw();
</script>
